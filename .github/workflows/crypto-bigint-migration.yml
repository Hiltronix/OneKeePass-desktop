name: Validate crypto-bigint security migration

on:
  push:
    branches:
      - security/crypto-bigint-0.7.10
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-bigint-security-migration
  cancel-in-progress: false

jobs:
  resolve-and-validate:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Set up Visual Studio MSVC compiler
        uses: ilammy/msvc-dev-cmd@v1

      - name: Prepare pinned SSH agent protocol vendor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vendor = 'src-tauri/vendor/ssh-agent-lib'
          if (-not (Test-Path "$vendor/Cargo.toml" -PathType Leaf)) {
            # Clone the verified v0.6.0 upstream commit, not a moving branch.
            git clone --depth 1 --branch v0.6.0 https://github.com/wiktor-k/ssh-agent-lib.git $vendor
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $sha = (git -C $vendor rev-parse HEAD).Trim()
            if ($sha -ne '59707d160628ca4804a7e21cf4e8a5cdc59f2e02') {
              throw "Unexpected ssh-agent-lib upstream revision: $sha"
            }
            # Keep original licenses and Rust source; do not import .git,
            # upstream fuzzing, CI, examples or test assets into our tree.
            Get-ChildItem $vendor -Force | Where-Object {
              $_.Name -notin @('src', 'Cargo.toml', 'LICENSE-APACHE', 'LICENSE-MIT', 'README.md')
            } | Remove-Item -Recurse -Force
            $cargo = Get-Content "$vendor/Cargo.toml" -Raw
            $original = 'ssh-key = { version = "0.6", features = ["crypto", "alloc"] }'
            $updated = 'ssh-key = { version = "0.6.7", features = ["ed25519", "rsa", "ecdsa", "encryption", "getrandom", "alloc"] }'
            if (-not $cargo.Contains($original)) { throw "Unexpected upstream ssh-key feature declaration" }
            $cargo = $cargo.Replace($original, $updated)
            $cargo = $cargo.Replace('members = [".", "fuzz"]', 'members = ["."]')
            $cargo = $cargo.Replace('ssh-key = { version = "0.6.7", features = ["p256", "rsa"] }', 'ssh-key = { version = "0.6.7", features = ["ed25519", "rsa"] }')
            $cargo = $cargo.Replace("p256 = { version = ""0.13.2"" }`n", '')
            Set-Content -Path "$vendor/Cargo.toml" -Value $cargo -NoNewline
            Set-Content -Path "$vendor/README-HILTRONIX.md" -Value 'Vendored from wiktor-k/ssh-agent-lib v0.6.0 (MIT OR Apache-2.0). Only older ECC feature selection was disabled; ECDSA signing is moved to the existing modern RustCrypto SSH key library. Preserve both upstream licenses.'
          }

      - name: Resolve patched dependency graph
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo update --manifest-path src-tauri/Cargo.toml --package onekeepass-core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $LockText = Get-Content src-tauri/Cargo.lock -Raw
          if ($LockText -match '(?s)\[\[package\]\]\s+name = "crypto-bigint"\s+version = "0\.7\.6"') {
            cargo update --manifest-path src-tauri/Cargo.toml --package crypto-bigint@0.7.6 --precise 0.7.10
          } else {
            cargo update --manifest-path src-tauri/Cargo.toml --package crypto-bigint@0.7.10 --precise 0.7.10
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # A green job must mean the old, vulnerable branch is absent.
          $ResolvedLock = Get-Content src-tauri/Cargo.lock -Raw
          if ($ResolvedLock -match '(?s)\[\[package\]\]\s+name = "crypto-bigint"\s+version = "0\.5\.5"') {
            throw 'crypto-bigint 0.5.5 remains in Cargo.lock'
          }
          if ($ResolvedLock -notmatch '(?s)\[\[package\]\]\s+name = "crypto-bigint"\s+version = "0\.7\.10"') {
            throw 'crypto-bigint 0.7.10 missing from Cargo.lock'
          }
          Write-Host 'PASS: crypto-bigint 0.7.10 is present and 0.5.5 is absent'
          cargo tree --manifest-path src-tauri/Cargo.toml --invert crypto-bigint@0.7.10
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo metadata --manifest-path src-tauri/Cargo.toml --locked --format-version 1 > $null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile desktop and shared-core code
        shell: pwsh
        run: |
          # Use the existing offline Windows Tauri config, which disables the unused proxy sidecar.
          $env:TAURI_CONFIG = Get-Content src-tauri/tauri.windows-offline.conf.json -Raw
          cargo check --manifest-path src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check out pinned core for isolated unit tests
        uses: actions/checkout@v4
        with:
          repository: Hiltronix/OneKeePass-onekeepass-core
          ref: c8da1b1d90c5e6aa2db1f33dad794e545dd664d7
          path: core-security-tests
          persist-credentials: false

      - name: Test passkey cryptography
        shell: pwsh
        run: |
          cargo test --manifest-path core-security-tests/Cargo.toml --lib passkey_crypto
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test SSH Agent
        shell: pwsh
        run: |
          $env:TAURI_CONFIG = Get-Content src-tauri/tauri.windows-offline.conf.json -Raw
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin onekeepass-frontend ssh_agent::store::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve validated lockfile on security branch
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/Cargo.lock src-tauri/vendor/ssh-agent-lib
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m 'Resolve patched Rust crypto dependencies on security branch'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:security/crypto-bigint-0.7.10
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
