name: Hiltronix dependency security audit


on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hiltronix-security-audit.yml'
      - 'src-tauri/Cargo.lock'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/src/main.rs'
      - 'src-tauri/src/commands.rs'
      - 'src-tauri/src/ssh_agent/**'
      - 'src-tauri/capabilities/**'
      - 'onekeepass-proxy/Cargo.lock'
      - 'yarn.lock'
      - 'package.json'

permissions:
  contents: read

jobs:
  advisory-scan:
    name: RustSec and JavaScript dependency advisory scan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure Node and Yarn
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure Rust for cargo-audit
        uses: dtolnay/rust-toolchain@stable

      - name: Install security scan tools
        shell: bash
        run: |
          set -euo pipefail
          npm install --global yarn@1.22.22
          cargo install cargo-audit --locked

      - name: Scan Cargo lockfiles and JavaScript dependencies
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p security-reports

          echo 'Running RustSec checks (nonzero may indicate advisories)'
          cargo audit --file src-tauri/Cargo.lock --json             > security-reports/cargo-desktop.json 2> security-reports/cargo-desktop.stderr
          desktop_exit=$?

          cargo audit --file onekeepass-proxy/Cargo.lock --json             > security-reports/cargo-sidecar.json 2> security-reports/cargo-sidecar.stderr
          sidecar_exit=$?

          echo 'Running Yarn Classic advisory check'
          yarn audit --json             > security-reports/yarn-audit.jsonl 2> security-reports/yarn-audit.stderr
          yarn_exit=$?

          # This workflow archives findings instead of failing before report
          # upload. Surface prominent warnings so a green job is not confused
          # with a clean security bill of health.
          if (( desktop_exit != 0 )); then
            echo "::warning title=Desktop Rust advisories::cargo audit exit ${desktop_exit}; inspect report artifacts."
          fi
          if (( sidecar_exit != 0 )); then
            echo "::warning title=Legacy browser-proxy advisories::cargo audit exit ${sidecar_exit}; this proxy is not built or packaged on Windows."
          fi
          if (( yarn_exit != 0 )); then
            echo "::warning title=JavaScript dependency advisories::yarn audit exit ${yarn_exit}; inspect report artifacts."
          fi

          {
            echo '# Security dependency audit'
            echo
            echo "Source commit: ${GITHUB_SHA}"
            echo
            echo '| Inventory | Scan exit code |'
            echo '|---|---:|'
            echo "| Windows desktop Rust lockfile | ${desktop_exit} |"
            echo "| Native browser proxy Rust lockfile (built but not shipped) | ${sidecar_exit} |"
            echo "| Yarn application dependencies | ${yarn_exit} |"
            echo
            echo 'Exit 0 means the scanner found no flagged vulnerabilities or errors.'
            echo 'A nonzero result may indicate advisories, network access errors or scanner issues; inspect attached stderr/JSON.'
            echo 'This is an advisory scan, not an audit of code behavior or runtime traffic.'
          } > security-reports/SUMMARY.md
          cat security-reports/SUMMARY.md

          echo
          echo '--- RustSec desktop summary ---'
          if command -v jq >/dev/null && test -s security-reports/cargo-desktop.json; then
            jq -r '.vulnerabilities.list[]? | "\(.advisory.id) | \(.package.name) \(.package.version) | \(.advisory.title)"' security-reports/cargo-desktop.json | head -100
            jq -r '.warnings | to_entries[]? | "\(.key): \(.value | length) entries"' security-reports/cargo-desktop.json | head -30
          fi
          sed -n '1,25p' security-reports/cargo-desktop.stderr

          echo
          echo '--- RustSec sidecar summary ---'
          if command -v jq >/dev/null && test -s security-reports/cargo-sidecar.json; then
            jq -r '.vulnerabilities.list[]? | "\(.advisory.id) | \(.package.name) \(.package.version) | \(.advisory.title)"' security-reports/cargo-sidecar.json | head -100
          fi
          sed -n '1,25p' security-reports/cargo-sidecar.stderr

          echo
          echo '--- Yarn advisory summary ---'
          if command -v jq >/dev/null && test -s security-reports/yarn-audit.jsonl; then
            jq -r 'select(.type == "auditAdvisory") | .data.advisory | "\(.id) | \(.module_name) | \(.severity) | \(.title)"' security-reports/yarn-audit.jsonl | head -100
            jq -r 'select(.type == "auditSummary") | .data' security-reports/yarn-audit.jsonl | head -30
          fi
          sed -n '1,25p' security-reports/yarn-audit.stderr

          # Advisory findings must not abort the scan before its reports are archived.
          exit 0

      - name: Upload advisory reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hiltronix-Security-Dependency-Reports-${{ github.run_number }}
          path: security-reports/
          if-no-files-found: warn
          retention-days: 30
